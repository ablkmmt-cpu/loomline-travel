<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preview 06 — OG Share Card</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;font-family:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif}
  .card{width:1200px;height:630px;background:linear-gradient(135deg,#071612 0%,#10231f 55%,#183a32 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:64px 72px}
  .grain{position:absolute;inset:0;background:radial-gradient(circle at 82% 22%, rgba(230,198,114,.16) 0%, transparent 42%),radial-gradient(circle at 8% 88%, rgba(230,198,114,.10) 0%, transparent 38%)}
  .top{display:flex;align-items:center;gap:16px}
  .logo{width:52px;height:52px;border-radius:14px;background:var(--g,#d6ad68);display:flex;align-items:center;justify-content:center;color:#10231f;font-weight:900;font-size:22px}
  .brand{color:#f6ecd9;font-weight:800;font-size:17px;letter-spacing:.06em}
  .brand small{display:block;font-size:11px;letter-spacing:.2em;color:#a99f8b;text-transform:uppercase;font-weight:600;margin-top:3px}
  .tag{margin-left:auto;color:#e7c672;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;border:1px solid rgba(231,198,114,.5);padding:7px 14px;border-radius:99px}
  .middle{position:relative;z-index:1;max-width:820px}
  .k{color:#e7c672;font-size:14px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;margin-bottom:18px}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:64px;line-height:1.12;color:#fff8ed;font-weight:700}
  h1 em{font-style:normal;color:#e7c672}
  .sub{color:#cfc6b2;font-size:21px;margin-top:22px;line-height:1.5;font-weight:500}
  .bottom{display:flex;align-items:center;gap:20px;position:relative;z-index:1}
  .cta{background:#e7c672;color:#10231f;font-weight:800;font-size:15px;padding:14px 22px;border-radius:12px;letter-spacing:.02em}
  .note{color:#a99f8b;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <div class="grain"></div>
  <div class="top">
    <div class="logo">中</div>
    <div class="brand">TripToChina<small>Independent China Travel</small></div>
    <div class="tag">Standard Routes · 标准线路</div>
  </div>
  <div class="middle">
    <p class="k">Chengdu &amp; Pandas · 5 Days 4 Nights</p>
    <h1>Less Confusion.<br/><em>More China.</em></h1>
    <p class="sub">看得见的天数、路线与价格。首次来华旅行，从一条标准线路开始。</p>
  </div>
  <div class="bottom">
    <div class="cta">from ¥3,680 / person</div>
    <div class="note">www.triptochina.com</div>
  </div>
</div>
</body>
</html>
